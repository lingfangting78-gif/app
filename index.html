<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全球旅行记账 - 结算历史版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { display: none; }
        .menu-drop { animation: menuShow 0.2s ease-out; transform-origin: top right; }
        @keyframes menuShow { from { opacity: 0; transform: scale(0.95) translateY(-10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const SUPABASE_URL = 'https://jpbmwvuolejtqobsdncn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_5ld6kcXVmtRbJA49Fc53-w_97kBTAhi';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const CATEGORIES = [
            '🍲 餐饮', '🚗 交通', '✈️ 机票', '💸 各国现金', 
            '🏨 住宿', '🛍️ 购物(自用)', '🎁 购物(礼品)', '🎫 门票'
        ];

        const FIXED_RATE_CATEGORIES = ['✈️ 机票', '💸 各国现金', '🏨 住宿'];

        function CoupleTracker() {
            const getToday = () => new Date().toISOString().split('T')[0];
            
            const [trips, setTrips] = useState([]);
            const [currentTripId, setCurrentTripId] = useState(null);
            const [records, setRecords] = useState([]);
            const [activeTab, setActiveTab] = useState('view');
            const [editingId, setEditingId] = useState(null);
            const [user, setUser] = useState(localStorage.getItem('current_user') || '女友支付');
            const [isLoading, setIsLoading] = useState(true);
            const [isDropdownOpen, setIsDropdownOpen] = useState(false);
            const [isCategoryPickerOpen, setIsCategoryPickerOpen] = useState(false);
            
            const [debts, setDebts] = useState(JSON.parse(localStorage.getItem('monthly_debts') || '[]'));
            const [debtForm, setDebtForm] = useState({ title: '', amount: '' });
            const [settleSubTab, setSettleSubTab] = useState('pending');

            useEffect(() => {
                localStorage.setItem('monthly_debts', JSON.stringify(debts));
            }, [debts]);

            const addDebt = (e) => {
                e.preventDefault();
                if (!debtForm.title || !debtForm.amount) return;
                const now = new Date();
                const newDebt = { 
                    id: Date.now(), 
                    title: debtForm.title, 
                    amount: Number(debtForm.amount), 
                    date: now.toLocaleDateString(),
                    month: now.toLocaleString('default', { month: 'short' }) + ' ' + now.getFullYear(),
                    status: 'pending' 
                };
                setDebts([newDebt, ...debts]);
                setDebtForm({ title: '', amount: '' });
            };

            const toggleDebtStatus = (id) => {
                setDebts(debts.map(d => d.id === id ? { ...d, status: d.status === 'pending' ? 'paid' : 'pending' } : d));
            };

            const deleteDebt = (id) => {
                setDebts(debts.filter(d => d.id !== id));
            };

            const totalPending = useMemo(() => 
                debts.filter(d => d.status === 'pending').reduce((sum, d) => sum + d.amount, 0), [debts]);

            const groupedPaidDebts = useMemo(() => {
                const groups = {};
                debts.filter(d => d.status === 'paid').forEach(d => {
                    if (!groups[d.month]) groups[d.month] = [];
                    groups[d.month].push(d);
                });
                return groups;
            }, [debts]);

            const [lastCustomRate, setLastCustomRate] = useState('7.5'); 
            const [form, setForm] = useState({ 
                title: '', amount: '', category: '🍲 餐饮', currency: 'LOCAL', rate: '7.5', date: getToday() 
            });

            useEffect(() => {
                if (FIXED_RATE_CATEGORIES.includes(form.category)) {
                    setForm(prev => ({ ...prev, rate: '1' }));
                } else if (editingId === null) {
                    setForm(prev => ({ ...prev, rate: lastCustomRate }));
                }
            }, [form.category, editingId]);

            useEffect(() => { fetchTrips(); }, []);
            useEffect(() => { if (currentTripId) fetchRecords(currentTripId); }, [currentTripId]);

            async function fetchTrips() {
                try {
                    const { data } = await supabaseClient.from('trips').select('*').order('id', { ascending: false });
                    if (data && data.length > 0) {
                        setTrips(data);
                        if (!currentTripId) setCurrentTripId(data[0].id);
                    }
                } finally {
                    setIsLoading(false);
                }
            }

            async function fetchRecords(tid) {
                const { data } = await supabaseClient.from('records').select('*').eq('trip_id', tid).order('date', { ascending: false }).order('id', { ascending: false });
                setRecords(data || []);
            }

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!form.title || !form.amount) return;
                let targetTripId = currentTripId;
                const payload = { 
                    title: form.title, amount: Number(form.amount), category: form.category,
                    currency: form.currency, rate: Number(form.rate) || 1, date: form.date,
                    trip_id: targetTripId, payer: user, 
                    time: editingId ? form.time : new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false }) 
                };
                if (editingId) { 
                    await supabaseClient.from('records').update(payload).eq('id', editingId); 
                    setEditingId(null);
                } else { 
                    await supabaseClient.from('records').insert([payload]); 
                    if (!FIXED_RATE_CATEGORIES.includes(form.category)) setLastCustomRate(form.rate);
                }
                await fetchRecords(targetTripId);
                setForm({ ...form, title: '', amount: '', date: getToday() });
                setActiveTab('view');
            };

            const stats = useMemo(() => {
                return records.reduce((acc, r) => {
                    const rate = Number(r.rate) || 1;
                    const valMYR = Number(r.amount) / rate;
                    if (r.payer === '女友支付') acc.gf += valMYR; else acc.bf += valMYR;
                    return acc;
                }, { gf: 0, bf: 0 });
            }, [records]);

            const groupedRecords = useMemo(() => {
                const groups = {};
                records.forEach(r => {
                    if (!groups[r.date]) groups[r.date] = { list: [], dayTotal: 0 };
                    groups[r.date].list.push(r);
                    const rate = Number(r.rate) || 1;
                    groups[r.date].dayTotal += (Number(r.amount) / rate);
                });
                return groups;
            }, [records]);

            const currentTrip = trips.find(t => t.id == currentTripId);
            const currentTripName = currentTrip?.name || '开始记账';

            if (isLoading) return <div className="h-screen flex items-center justify-center font-black text-indigo-500 italic text-2xl">LOADING...</div>;

            return (
                <div className="min-h-screen pb-32">
                    {/* Header - 修改了圆角和高度间距 */}
                    <div className="bg-slate-900 pt-10 pb-10 px-6 rounded-b-[40px] shadow-2xl text-white relative z-20">
                        <div className="flex justify-between items-center mb-10 relative z-30">
                            <div className="flex items-center gap-2">
                                <div className="relative">
                                    <button onClick={() => setIsDropdownOpen(!isDropdownOpen)} className="flex items-center gap-2">
                                        <span className="text-indigo-400 font-black text-2xl tracking-tight max-w-[180px] truncate">{currentTripName}</span>
                                        <svg className={`w-5 h-5 transition-transform ${isDropdownOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M19 9l-7 7-7-7" /></svg>
                                    </button>
                                    {isDropdownOpen && (
                                        <>
                                            <div className="fixed inset-0" onClick={() => setIsDropdownOpen(false)}></div>
                                            <div className="absolute top-12 left-0 w-72 bg-slate-800 border border-slate-700 rounded-3xl shadow-2xl py-3 z-40 menu-drop">
                                                <div className="max-h-64 overflow-y-auto custom-scrollbar">
                                                    {trips.map(t => (
                                                        <div key={t.id} onClick={() => { setCurrentTripId(t.id); setIsDropdownOpen(false); }} className={`flex justify-between items-center px-6 py-4 text-sm font-bold ${currentTripId == t.id ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-700'}`}>
                                                            <span className="truncate flex-1">{t.name}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                        <div className="text-center mb-10">
                            <p className="text-slate-500 text-[10px] uppercase tracking-[0.4em] mb-2 font-black">Total Expenditure</p>
                            <div className="flex flex-col items-center">
                                <div className="flex items-baseline justify-center gap-1">
                                    <span className="text-2xl font-black text-indigo-500 italic">RM</span>
                                    <span className="text-6xl font-black italic tracking-tighter text-white">{(stats.gf + stats.bf).toFixed(2)}</span>
                                </div>
                                <div className="mt-2 bg-indigo-500/20 px-3 py-1 rounded-full">
                                    <p className="text-[10px] font-black text-indigo-300 uppercase tracking-widest">一人应付: RM {((stats.gf + stats.bf) / 2).toFixed(2)}</p>
                                </div>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-rose-500/10 border border-rose-500/20 rounded-[30px] p-5 text-center">
                                <p className="text-rose-400 text-[9px] font-black uppercase mb-1 tracking-widest opacity-70">FT Spending</p>
                                <p className="text-2xl font-black text-rose-50 tracking-tight">RM {stats.gf.toFixed(2)}</p>
                            </div>
                            <div className="bg-indigo-500/10 border border-indigo-500/20 rounded-[30px] p-5 text-center">
                                <p className="text-indigo-400 text-[9px] font-black uppercase mb-1 tracking-widest opacity-70">YS Spending</p>
                                <p className="text-2xl font-black text-indigo-50 tracking-tight">RM {stats.bf.toFixed(2)}</p>
                            </div>
                        </div>
                    </div>

                    {/* Content Container - 移除了 -mt-6 并增加了 pt-8 */}
                    <div className="max-w-md mx-auto px-5 pt-8 relative z-10">
                        {activeTab === 'add' ? (
                            <div className="bg-white rounded-[40px] p-8 shadow-2xl border border-slate-100 animate-slide-up">
                                <div className="flex bg-slate-100 p-1.5 rounded-3xl mb-8">
                                    <button type="button" onClick={() => setUser('女友支付')} className={`flex-1 py-4 rounded-2xl text-[10px] font-black tracking-widest transition-all ${user === '女友支付' ? 'bg-rose-500 text-white shadow-lg' : 'text-slate-400'}`}>FT PAID</button>
                                    <button type="button" onClick={() => setUser('男友支付')} className={`flex-1 py-4 rounded-2xl text-[10px] font-black tracking-widest transition-all ${user === '男友支付' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400'}`}>YS PAID</button>
                                </div>
                                <form onSubmit={handleSubmit} className="space-y-6">
                                    <div className="flex gap-3">
                                        <div className="flex-1">
                                            <label className="text-[10px] font-black text-slate-400 ml-1 mb-1 block uppercase">Date</label>
                                            <input type="date" className="w-full bg-slate-50 p-4 rounded-2xl text-xs font-bold border border-slate-100" value={form.date} onChange={e => setForm({...form, date: e.target.value})} />
                                        </div>
                                        <div className="w-1/2 relative">
                                            <label className="text-[10px] font-black text-slate-400 ml-1 mb-1 block uppercase">Category</label>
                                            <button type="button" onClick={() => setIsCategoryPickerOpen(!isCategoryPickerOpen)} className="w-full bg-slate-50 p-4 rounded-2xl text-xs font-bold border border-slate-100 flex justify-between items-center">
                                                <span className="truncate">{form.category}</span>
                                            </button>
                                            {isCategoryPickerOpen && (
                                                <div className="absolute top-full left-0 right-0 mt-2 bg-white border border-slate-100 rounded-3xl shadow-2xl z-[70] py-2 menu-drop overflow-hidden">
                                                    <div className="max-h-60 overflow-y-auto custom-scrollbar">
                                                        {CATEGORIES.map(cat => (
                                                            <button key={cat} type="button" onClick={() => { setForm({...form, category: cat}); setIsCategoryPickerOpen(false); }} className={`w-full text-left px-5 py-3.5 text-xs font-bold ${form.category === cat ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-50'}`}>{cat}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 ml-1 mb-1 block uppercase">Item Title</label>
                                        <input placeholder="输入详情..." className="w-full bg-slate-50 p-4 rounded-2xl text-sm font-bold border border-slate-100 outline-none" value={form.title} onChange={e => setForm({...form, title: e.target.value})} />
                                    </div>
                                    <div className="flex gap-3">
                                        <div className="flex-1">
                                            <label className="text-[10px] font-black text-slate-400 ml-1 mb-1 block uppercase tracking-widest">Amount</label>
                                            <input type="number" step="any" className="w-full bg-slate-50 p-4 rounded-2xl font-black text-2xl border border-slate-100 outline-none" value={form.amount} onChange={e => setForm({...form, amount: e.target.value})} />
                                        </div>
                                        <div className="w-[120px]">
                                            <label className="text-[10px] font-black text-slate-400 ml-1 mb-1 block uppercase text-center">Rate</label>
                                            <input type="number" step="any" readOnly={FIXED_RATE_CATEGORIES.includes(form.category)} className={`w-full p-4 rounded-2xl font-mono text-sm text-center border ${FIXED_RATE_CATEGORIES.includes(form.category) ? 'bg-slate-100 text-slate-400' : 'bg-white text-indigo-600 border-indigo-100 font-bold'}`} value={form.rate} onChange={e => setForm({...form, rate: e.target.value})} />
                                        </div>
                                    </div>
                                    <button className={`w-full text-white font-black py-5 rounded-[24px] shadow-xl active:scale-95 transition-all ${user === '女友支付' ? 'bg-rose-500' : 'bg-indigo-600'}`}>SAVE TRANSACTION</button>
                                </form>
                            </div>
                        ) : activeTab === 'view' ? (
                            <div className="space-y-10">
                                {Object.keys(groupedRecords).map(date => (
                                    <div key={date}>
                                        <div className="flex justify-between items-end mb-5 px-2">
                                            <div className="flex items-center gap-3"><div className="h-1 w-4 bg-indigo-500 rounded-full"></div><h3 className="text-xs font-black text-slate-800 tracking-tighter">{date}</h3></div>
                                            <div className="bg-indigo-50 px-3 py-1.5 rounded-2xl text-right">
                                                <p className="text-[10px] font-black text-indigo-600">RM {groupedRecords[date].dayTotal.toFixed(2)}</p>
                                                <p className="text-[8px] font-bold text-indigo-300 leading-none">一人 RM {(groupedRecords[date].dayTotal / 2).toFixed(2)}</p>
                                            </div>
                                        </div>
                                        <div className="space-y-4">
                                            {groupedRecords[date].list.map(r => (
                                                <div key={r.id} onClick={() => {setForm(r); setEditingId(r.id); setActiveTab('add'); setUser(r.payer);}} className="bg-white p-6 rounded-[30px] flex justify-between items-center shadow-sm border border-slate-100 active:scale-95 transition-all">
                                                    <div className="flex items-center gap-4">
                                                        <div className="w-12 h-12 rounded-xl bg-slate-50 flex items-center justify-center text-xl">{r.category.substring(0,2)}</div>
                                                        <div><p className="font-bold text-sm text-slate-800 mb-2">{r.title}</p><span className={`text-[8px] px-2 py-0.5 rounded font-black ${r.payer === '女友支付' ? 'bg-rose-50 text-rose-500' : 'bg-indigo-50 text-indigo-500'}`}>{r.payer === '女友支付' ? 'GF' : 'BF'}</span></div>
                                                    </div>
                                                    <div className="text-right">
                                                        <p className="font-black text-slate-900 text-lg italic tracking-tighter">RM {(Number(r.amount) / (Number(r.rate) || 1)).toFixed(2)}</p>
                                                        <p className="text-[9px] font-bold text-slate-400 italic">一人 RM {( (Number(r.amount) / (Number(r.rate) || 1)) / 2 ).toFixed(2)}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            /* Settle Tab */
                            <div className="space-y-6 animate-slide-up pb-10">
                                <div className="bg-indigo-600 rounded-[40px] p-8 text-white shadow-2xl relative overflow-hidden">
                                    <div className="relative z-10">
                                        <p className="text-[10px] font-black uppercase tracking-[0.3em] opacity-60 mb-2">Total Owed to BF</p>
                                        <p className="text-4xl font-black italic">RM {totalPending.toFixed(2)}</p>
                                    </div>
                                </div>

                                <div className="flex bg-white p-1.5 rounded-3xl shadow-sm border border-slate-100">
                                    <button onClick={() => setSettleSubTab('pending')} className={`flex-1 py-3 rounded-2xl text-[10px] font-black tracking-widest transition-all ${settleSubTab === 'pending' ? 'bg-slate-900 text-white' : 'text-slate-400'}`}>PENDING ⏳</button>
                                    <button onClick={() => setSettleSubTab('paid')} className={`flex-1 py-3 rounded-2xl text-[10px] font-black tracking-widest transition-all ${settleSubTab === 'paid' ? 'bg-slate-900 text-white' : 'text-slate-400'}`}>PAID HISTORY ✅</button>
                                </div>

                                {settleSubTab === 'pending' ? (
                                    <>
                                        <div className="bg-white rounded-[40px] p-6 shadow-xl border border-slate-100">
                                            <h3 className="text-xs font-black text-slate-800 mb-4 px-2 uppercase tracking-widest italic">New Debt Item</h3>
                                            <form onSubmit={addDebt} className="flex gap-2">
                                                <input className="flex-1 bg-slate-50 p-4 rounded-2xl text-xs font-bold border border-slate-100 outline-none" placeholder="项目 (如: 12月房租)" value={debtForm.title} onChange={e => setDebtForm({...debtForm, title: e.target.value})} />
                                                <input type="number" className="w-24 bg-slate-50 p-4 rounded-2xl text-xs font-black border border-slate-100 outline-none" placeholder="RM" value={debtForm.amount} onChange={e => setDebtForm({...debtForm, amount: e.target.value})} />
                                                <button className="bg-indigo-600 text-white p-4 rounded-2xl shadow-lg active:scale-95 transition-all"><svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg></button>
                                            </form>
                                        </div>
                                        <div className="space-y-3">
                                            {debts.filter(d => d.status === 'pending').map(debt => (
                                                <div key={debt.id} className="bg-white p-5 rounded-[24px] flex justify-between items-center shadow-sm border border-slate-50">
                                                    <div className="flex items-center gap-4">
                                                        <button onClick={() => toggleDebtStatus(debt.id)} className="w-8 h-8 rounded-full border-2 border-slate-100 flex items-center justify-center text-slate-200 hover:border-green-500 hover:text-green-500 transition-all"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="4" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></button>
                                                        <div><p className="font-bold text-sm text-slate-800">{debt.title}</p><p className="text-[10px] text-slate-400 font-bold">{debt.date}</p></div>
                                                    </div>
                                                    <div className="flex items-center gap-4">
                                                        <p className="font-black text-indigo-600 text-base italic">RM {debt.amount.toFixed(2)}</p>
                                                        <button onClick={() => deleteDebt(debt.id)} className="text-slate-200 hover:text-rose-500"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                ) : (
                                    <div className="space-y-8">
                                        {Object.keys(groupedPaidDebts).map(month => (
                                            <div key={month} className="space-y-3">
                                                <div className="flex items-center gap-2 px-2">
                                                    <span className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">{month}</span>
                                                    <div className="h-[1px] flex-1 bg-slate-100"></div>
                                                    <span className="text-[10px] font-black text-green-600 bg-green-50 px-2 py-0.5 rounded-full">Total Paid: RM {groupedPaidDebts[month].reduce((s, d) => s + d.amount, 0).toFixed(2)}</span>
                                                </div>
                                                {groupedPaidDebts[month].map(debt => (
                                                    <div key={debt.id} className="bg-slate-100/50 p-5 rounded-[24px] flex justify-between items-center opacity-60">
                                                        <div className="flex items-center gap-4">
                                                            <div className="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-white"><svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="4" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
                                                            <div><p className="font-bold text-sm text-slate-500 line-through">{debt.title}</p></div>
                                                        </div>
                                                        <div className="flex items-center gap-4">
                                                            <p className="font-black text-slate-500 text-base italic">RM {debt.amount.toFixed(2)}</p>
                                                            <button onClick={() => toggleDebtStatus(debt.id)} className="text-slate-300 hover:text-indigo-500 text-[10px] font-black uppercase">Undo</button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Footer */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t border-slate-100 px-6 py-6 flex justify-around items-center z-50 pb-[calc(env(safe-area-inset-bottom)+20px)]">
                        <button onClick={() => setActiveTab('view')} className="flex flex-col items-center gap-2">
                            <div className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${activeTab === 'view' ? 'bg-indigo-600 text-white scale-110 shadow-lg' : 'bg-slate-100 text-slate-400'}`}><svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h7"/></svg></div>
                            <span className={`text-[8px] font-black tracking-widest ${activeTab === 'view' ? 'text-indigo-600' : 'text-slate-300'}`}>LIST</span>
                        </button>
                        <button onClick={() => { setEditingId(null); setForm({...form, title: '', amount: '', date: getToday()}); setActiveTab('add'); }} className="flex flex-col items-center gap-2 -mt-8">
                            <div className={`w-16 h-16 rounded-full flex items-center justify-center shadow-2xl transition-all ${activeTab === 'add' ? 'bg-indigo-600 text-white scale-110' : 'bg-slate-900 text-white'}`}><svg className="w-8 h-8" fill="none" stroke="currentColor" strokeWidth="3.5" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg></div>
                            <span className={`text-[8px] font-black tracking-widest ${activeTab === 'add' ? 'text-indigo-600' : 'text-slate-300'}`}>ADD</span>
                        </button>
                        <button onClick={() => setActiveTab('settle')} className="flex flex-col items-center gap-2">
                            <div className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${activeTab === 'settle' ? 'bg-indigo-600 text-white scale-110 shadow-lg' : 'bg-slate-100 text-slate-400'}`}><svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2M12 8V7m0 1v8m0 0v1"/></svg></div>
                            <span className={`text-[8px] font-black tracking-widest ${activeTab === 'settle' ? 'text-indigo-600' : 'text-slate-300'}`}>SETTLE</span>
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CoupleTracker />);
    </script>
</body>
</html>
